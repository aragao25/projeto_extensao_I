<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Meu Sistema</title>
    
    <!-- 1. Estilos Globais -->
    <link rel="stylesheet" href="../../styles/global.css">
    
    <!-- 2. Componentes Reutilizáveis -->
    <link rel="stylesheet" href="../../components/input.css">
    <link rel="stylesheet" href="../../components/button.css">
    
    <!-- 3. Estilo Específico desta Página -->
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <main class="tela-cadastro">
        <h1 class="tela-cadastro__title">Cadastro</h1>

        <form id="cadastro-form">
            <div class="tela-cadastro__field">
                <label for="nome-completo" class="sr-only">Nome Completo</label>
                <!-- Usando a classe reutilizável de componente -->
                <input type="text" id="nome-completo" class="input-campo" placeholder="Nome Completo" required>
            </div>

            <div class="tela-cadastro__field">
                <label for="cpf" class="sr-only">CPF</label>
                <input type="text" id="cpf" class="input-campo" placeholder="CPF" required>
            </div>

            <div class="tela-cadastro__field">
                <label for="data-nascimento" class="sr-only">Data de Nascimento</label>
                <input 
                    type="text"
                    id="data-nascimento"
                    class="input-campo"
                    placeholder="Data de Nascimento"
                    onfocus="(this.type='date')"
                    onblur="if(!this.value) this.type='text'"
                    required
                >
            </div>

            <div class="tela-cadastro__field">
                <label for="telefone" class="sr-only">Telefone</label>
                <input type="tel" id="telefone" class="input-campo" placeholder="Telefone" required>
            </div>

            <div class="tela-cadastro__field">
                <label for="email" class="sr-only">E-Mail</label>
                <input type="email" id="email" class="input-campo" placeholder="E-Mail" required>
            </div>

            <div class="tela-cadastro__field">
                <label for="senha" class="sr-only">Senha</label>
                <input type="password" id="senha" class="input-campo" placeholder="Senha" required>
            </div>

            <div class="tela-cadastro__field">
                <label for="repete-senha" class="sr-only">Senha</label>
                <input type="password" id="repete-senha" class="input-campo" placeholder="Repetir Senha" required>
            </div>

            <button type="submit" class="botao-primario">Cadastrar</button>
        </form>

    </main>
</body>
