<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Meu Sistema</title>
      <!-- 3 linhas para carregar a fonte Inter para o sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!-- 1. Estilos Globais -->
    <link rel="stylesheet" href="../../styles/global.css">

    <!-- 2. Componentes Reutilizáveis -->
    <link rel="stylesheet" href="../../components/input.css">
    <link rel="stylesheet" href="../../components/button.css">
    <link rel="stylesheet" href="../../styles/validar-senhas.css">
    
    <!-- 3. Estilo Específico desta Página -->
    <link rel="stylesheet" href="cadastro_usuario.css">
</head>

<body>
    <main class="tela-cadastro">
        <h1 class="tela-cadastro__title">Formulário de Cadastro</h1>

        <form id="cadastro-form">
            <div class="label-campo">
                <label for="nome-completo">Nome Completo</label>
                <!-- Usando a classe reutilizável de componente -->
                <input type="text" id="nome-completo" class="input-campo" required>
            </div>

            <div class="tela-cadastro__linha">
                <div class="label-campo">
                    <label for="telefone" >Telefone</label>
                    <input type="tel" id="telefone" class="input-campo" required>
                </div>

                <div class="label-campo">
                    <label for="data-nascimento">Data de Nascimento</label>
                    <input 
                        type="date"
                        id="data-nascimento"
                        class="input-campo"
                        required
                    >
                </div>
            </div>


            <div class="tela-cadastro__linha">
                <div class="label-campo">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" class="input-campo" required>
                </div>
            </div>

            <div class="tela-cadastro__linha">
                <div class="label-campo">
                    <label for="nova-senha">Senha</label>
                    <div class="campo-container">
                        <input 
                            type="password" 
                            id="nova-senha" 
                            class="input-campo" 
                            required
                        >

                        <button type="button" class="botao-visualiza" aria-label="Mostrar senha">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="label-campo">
                    <label for="repete-senha">Repetir Senha</label>
                    <div class="campo-container">
                        <input 
                            type="password" 
                            id="confirma-senha" 
                            class="input-campo"
                            required
                        >
                        <button type="button" class="botao-visualiza" aria-label="Mostrar senha">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="tela-atualiza-senha__regras">
                <ul>
                    <li id="caracteres">Mínimo 8 caracteres</li>
                    <li id="maiuscula">Pelo menos uma letra MAIÚSCULA</li>
                    <li id="minuscula">Pelo menos uma letra minúscula</li>
                    <li id="numero">Pelo menos um número</li>
                    <li id="especial">Pelo menos um carácter especial (@, #, $, %, &, * e !)</li>
                </ul>
            </div>

            <div class="tela-cadastro__botoes">
                <button type="submit" id="botao-salvar" class="botao-primario">Cadastrar</button>
                <button type="button" id="botao-cancelar" class="botao-primario">Cancelar</button>
            </div>

        </form>

    </main>
</body>

<script src="../../pages/cadastro_usuario/cadastro_usuario.js"></script>
<script src="../../utils/validar_senha.js"></script>
