<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="stylesheet" href="login.css">
    <title>Document</title>
</head>
<body>
    <div class="login">
        <h2>Login</h2>
        <input type="text" placeholder="Username">

        <div class="links">

            </label>
            <a href="#">Esqueceu sua senha?</a>

        <button class="botao-login">Login</button>
        <p style="font-size: 12px; margin-top: 15px">Ainda não tem um cadastro? <a href="#">Registre-se</a></p>
    </div>
</body>
</html>
