<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Meu Sistema</title>
      <!-- 3 linhas para carregar a fonte Inter para o sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!-- 1. Estilos Globais -->
    <link rel="stylesheet" href="../../styles/global.css">

    <!-- 2. Componentes Reutilizáveis -->
    <link rel="stylesheet" href="../../components/input.css">
    <link rel="stylesheet" href="../../components/button.css">
    
    <!-- 3. Estilo Específico desta Página -->
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <main class="tela-cadastro">
        <h1 class="tela-cadastro__title">Formulário de Cadastro</h1>

        <form id="cadastro-form">
            <div class="label-campo">
                <label for="nome-completo">Nome Completo</label>
                <!-- Usando a classe reutilizável de componente -->
                <input type="text" id="nome-completo" class="input-campo" placeholder="Nome Completo" required>
            </div>

            <div class="tela-cadastro__linha">
                <div class="label-campo">
                    <label for="cpf" >CPF</label>
                    <input type="text" id="cpf" class="input-campo" placeholder="CPF" required>
                </div>

                <div class="label-campo">
                    <label for="data-nascimento">Data de Nascimento</label>
                    <input 
                        type="date"
                        id="data-nascimento"
                        class="input-campo"
                        required
                    >
                </div>
            </div>


            <div class="tela-cadastro__linha">
                <div class="label-campo">
                    <label for="telefone" >Telefone</label>
                    <input type="tel" id="telefone" class="input-campo" placeholder="Telefone" required>
                </div>

                <div class="label-campo">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" class="input-campo" placeholder="E-Mail" required>
                </div>
            </div>

            <div class="tela-cadastro__linha">
                <div class="label-campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" class="input-campo" placeholder="Senha" required>
                </div>

                <div class="label-campo">
                    <label for="repete-senha">Repetir Senha</label>
                    <input type="password" id="repete-senha" class="input-campo" placeholder="Repetir Senha" required>
                </div>
            </div>

            <div class="tela-cadastro__botoes">
                <button type="submit" class="botao-primario">Cadastrar</button>
                <button type="button" class="botao-primario">Cancelar</button>
            </div>

        </form>

    </main>
</body>
