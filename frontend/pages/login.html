<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Document</title>
</head>

<body>
    <div class="login">
        <h2>Login</h2>

        <form id="form-usuario">
            <input type="text" placeholder="Usuário">
            <input type="password" placeholder="Senha">

            <div class="links">
                <label class="lembrar-me">
                    <input type="checkbox" id="lembrar">Lembre-me
                </label>
                <a href="#" class="esqueci-senha">Esqueceu sua senha?</a>
            </div>
            <button class="botao-login">Login</button>
        </form>
        <p class="registro">
            Ainda não tem um cadastro? <a href="#" class="link-registro">Registre-se</a></p>
    </div>
</body>
</html>
