<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Meu Sistema</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <header class="cabecalho1">
      <div class="logo-titulo">
        <div class="portal-logo">
          <i data-lucide="heart" fill="#ffffff" color="#ffffff" size="28"></i>
        </div>
        <div class="portal-titulo">
          <h1>Solidariedade Restinga</h1>
          <p>Conectando doações e necessidades</p>
        </div>
      </div>
      <div class="cabecalho-pesquisa">
        <i data-lucide="search" color="#0f172a"></i>
        <div class="barra-pesquisa">
          <input
            type="text"
            class="search-input"
            placeholder="Pesquisar itens para doação no bairro..."
          />
        </div>
      </div>

      <!-- Ações do cabeçalho com os 3 ícones -->
      <div class="acoes-header">
        <!-- Ícone de Notificação com Badge -->
        <button class="btn-icone" aria-label="Notificações">
          <svg
            class="icone-svg"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="badge-notificacao">3</span>
        </button>

        <!-- Ícone de Chat -->
        <button class="btn-icone" aria-label="Chat">
          <svg
            class="icone-svg"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            ></path>
          </svg>
        </button>

        <!-- Ícone de Minha Conta -->
        <button class="btn-icone" aria-label="Minha Conta">
          <svg
            class="icone-svg"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>

        <!-- Ícone da Página inicial -->
        <a href="nao_logado.html" class="btn-icone" aria-label="Página inicial">
          <svg
            class="icone-svg"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.5V20h14V9.5"></path>
            <path d="M9 20v-7h6v7"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- Tag semântica principal (W3C) -->
    <main class="tela-login">
      <h1 class="tela-login__title">Login</h1>

      <form class="tela-login__formulario" id="login-formulario">
        <!-- Campo Usuário -->
        <div class="tela-login__field">
          <label for="usuario" class="sr-only">Usuário</label>
          <input
            type="text"
            id="usuario"
            class="tela-login__input"
            placeholder="Usuário"
            required
            autocomplete="username"
          />
        </div>

        <!-- Campo Senha -->
        <div class="tela-login__field">
          <label for="senha" class="sr-only">Senha</label>
          <input
            type="password"
            id="senha"
            class="tela-login__input"
            placeholder="Senha"
            required
            autocomplete="current-password"
          />
        </div>

        <!-- Opções -->
        <div class="tela-login__opcoes">
          <label class="tela-login__checkbox-label">
            <input type="checkbox" id="lembrar" class="tela-login__checkbox" />
            <span>Lembre-me</span>
          </label>
          <a href="#" class="tela-login__link tela-login__link--esqueceu"
            >Esqueceu sua senha?</a
          >
        </div>

        <!-- Botão Enviar -->
        <button type="submit" class="tela-login__button">Entrar</button>
      </form>

      <p class="tela-login__footer">
        Ainda não tem um cadastro?
        <a href="#" class="tela-login__link tela-login__link--registro"
          >Registre-se</a
        >
      </p>
    </main>
  </body>
</html>
