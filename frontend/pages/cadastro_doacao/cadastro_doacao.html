<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Doação</title>
  <link rel="stylesheet" href="cadastro_doacao.css">
  <script src="cadastro_doacao.js" type="module" defer></script>
</head>
<body>
  <main class="conteudo">
    <section class="cartao">
      <div class="cabecalho-cartao">
        <div>
          <span class="subtitulo">NOVA PUBLICAÇÃO</span>
          <h1>Cadastro de doação</h1>
          <p>Informe os dados do item que você deseja compartilhar.</p>
        </div>
        <div class="icone-secao" aria-hidden="true">📦</div>
      </div>

      <form class="form-doacao" id="form-doacao">
        <div class="campo campo-inteiro">
          <label for="titulo">Título do anúncio</label>
          <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="Ex.: Mesa de estudo"
            minlength="3"
            maxlength="120"
            required
          >
        </div>

        <div class="campo campo-inteiro">
          <label for="descricao">Descrição do item</label>
          <textarea
            id="descricao"
            name="descricao"
            rows="4"
            maxlength="2000"
            placeholder="Descreva as condições e os detalhes do item."
          ></textarea>
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <input
            type="text"
            id="categoria"
            name="categoria"
            placeholder="Ex.: Móveis"
            minlength="2"
            maxlength="60"
            required
          >
        </div>

        <div class="campo">
          <label for="estado-conservacao">Estado de conservação</label>
          <select id="estado-conservacao" name="estado_conservacao" required>
            <option value="">Selecione</option>
            <option value="novo">Novo</option>
            <option value="bom">Bom</option>
            <option value="regular">Regular</option>
          </select>
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input
            type="text"
            id="cidade"
            name="cidade"
            placeholder="Digite a cidade"
            minlength="2"
            maxlength="80"
            required
          >
        </div>

        <div class="campo">
          <label for="bairro">Bairro</label>
          <input
            type="text"
            id="bairro"
            name="bairro"
            placeholder="Digite o bairro"
            maxlength="80"
          >
        </div>

        <div class="campo">
          <label for="quantidade">Quantidade</label>
          <input
            type="number"
            id="quantidade"
            name="quantidade"
            min="1"
            max="1000"
            value="1"
            required
          >
        </div>

        <div class="campo campo-inteiro">
          <label for="imagens">Fotos do item</label>
          <input
            type="file"
            id="imagens"
            name="imagens"
            accept="image/*"
            multiple
          >
          <div id="preview-container" class="preview-container"></div>
        </div>

        <div class="acoes-formulario">
          <button type="submit" class="botao botao-principal">
            Publicar doação
          </button>
          <button type="reset" class="botao botao-secundario">
            Cancelar
          </button>
        </div>

        <p id="mensagem-doacao" class="mensagem" role="status"
           aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
