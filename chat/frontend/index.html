
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonte utilizada no projeto -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
    >

    <!-- Ícones -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"
    >

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="./css/style.css">

    <title>Doar pro Bem</title>
</head>

<body>

    <section class="container">

        <!-- =====================================================
             TELA DE LOGIN
        ====================================================== -->

        <section class="login">

            <h2>Doar pro Bem</h2>

            <p class="login__description">
                Entre para conversar sobre uma doação.
            </p>

            <form class="login__form">

                <!-- Nome do usuário -->
                <input
                    type="text"
                    class="login__input"
                    placeholder="Seu nome"
                    maxlength="50"
                    required
                >

                <!-- Identificação da doação -->
                <!--
                    No sistema completo, esse ID poderá ser
                    recebido automaticamente da página da doação.
                -->
                <input
                    type="number"
                    class="login__input"
                    id="donationInput"
                    placeholder="ID da doação"
                    min="1"
                    required
                >

                <button
                    type="submit"
                    class="login__button">

                    Entrar no chat

                </button>

            </form>

        </section>


        <!-- =====================================================
             ÁREA DO CHAT
        ====================================================== -->

        <section class="chat">

            <!-- =================================================
                 CABEÇALHO DA DOAÇÃO
            ================================================== -->

            <header class="chat__header">

                <div>

                    <h2 id="donationTitle">
                        Doação
                    </h2>

                    <p id="donationInfo">
                        Conversa sobre a doação
                    </p>

                    <!-- Status atual da doação -->
                    <span
                        id="donationStatus"
                        class="status status--available">

                        Disponível

                    </span>

                </div>


                <!-- Botão para sair da conversa -->
                <button
                    type="button"
                    id="leaveButton"
                    class="chat__leave"
                    title="Sair da conversa">

                    <span class="material-symbols-outlined">
                        logout
                    </span>

                </button>

            </header>


            <!-- =================================================
                 MENSAGENS
            ================================================== -->

            <section class="chat__messages">
                <!--
                    As mensagens serão inseridas
                    dinamicamente pelo JavaScript.
                -->
            </section>


            <!-- =================================================
                 AÇÕES RELACIONADAS À DOAÇÃO
            ================================================== -->

            <section class="donation__actions">

                <!-- Combinar a entrega dentro do sistema -->
                <button
                    type="button"
                    id="negotiateButton"
                    class="action__button">

                    <span class="material-symbols-outlined">
                        handshake
                    </span>

                    Combinar entrega

                </button>


                <!-- Confirmar que a doação foi realizada -->
                <button
                    type="button"
                    id="completeButton"
                    class="action__button">

                    <span class="material-symbols-outlined">
                        check_circle
                    </span>

                    Confirmar doação

                </button>


                <!-- Denunciar comportamento inadequado -->
                <button
                    type="button"
                    id="reportButton"
                    class="action__button action__button--danger">

                    <span class="material-symbols-outlined">
                        flag
                    </span>

                    Denunciar

                </button>

            </section>


            <!-- =================================================
                 CAMPO DE ENVIO
            ================================================== -->

            <form class="chat__form">

                <input
                    type="text"
                    class="chat__input"
                    placeholder="Digite uma mensagem"
                    maxlength="500"
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    class="chat__button"
                    title="Enviar mensagem">

                    <span class="material-symbols-outlined">
                        send
                    </span>

                </button>

            </form>

        </section>

    </section>


    <!-- JavaScript -->
    <script src="./js/script.js"></script>

</body>

</html>
